<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmar Documento ✍️</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; text-align: center; }
        /* La pizarra para firmar */
        canvas { border: 2px dashed #000; background: #f4f4f4; width: 100%; height: 200px; touch-action: none; cursor: crosshair; }
        button { margin-top: 15px; padding: 12px; width: 100%; background: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 5px; }
        .btn-limpiar { background: #dc3545; }
        input { margin: 15px 0; }
    </style>
</head>
<body>

    <h2>Firma el documento aquí 👇</h2>
    
    <label>1. Sube el PDF (El que ya tiene tu firma):</label>
    <input type="file" id="pdfInput" accept="application/pdf">

    <label>2. Dibuja tu firma:</label>
    <canvas id="pizarra"></canvas>
    <button class="btn-limpiar" onclick="limpiar()">Limpiar Firma 🧹</button>

    <button onclick="firmar()">Guardar PDF Firmado 📥</button>

    <script>
        const canvas = document.getElementById('pizarra');
        const ctx = canvas.getContext('2d');
        let dibujando = false;

        // Ajustar tamaño real del canvas
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        // Funciones para dibujar (Mouse y Táctil) 🎨
        const empezar = (e) => { dibujando = true; dibujar(e); }
        const terminar = () => { dibujando = false; ctx.beginPath(); }
        const dibujar = (e) => {
            if (!dibujando) return;
            e.preventDefault(); // Evita que la pantalla haga scroll en celulares
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Escuchar eventos
        canvas.addEventListener('mousedown', empezar); canvas.addEventListener('mouseup', terminar); canvas.addEventListener('mousemove', dibujar);
        canvas.addEventListener('touchstart', empezar); canvas.addEventListener('touchend', terminar); canvas.addEventListener('touchmove', dibujar);

        function limpiar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        async function firmar() {
            const file = document.getElementById('pdfInput').files[0];
            if (!file) return alert("Falta subir el PDF ⚠️");

            // Convertir el dibujo a una imagen PNG en base64
            const imgDataUrl = canvas.toDataURL('image/png');

            // Leer PDF y cargar librería
            const pdfBytes = await file.arrayBuffer();
            const { PDFDocument } = PDFLib;
            const pdfDoc = await PDFDocument.load(pdfBytes);
            
            // Cargar la imagen de la firma dibujada
            const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
            const firmaImg = await pdfDoc.embedPng(imgBytes);

            // Pegar la firma en la primera página
            const pagina = pdfDoc.getPages()[0];
            pagina.drawImage(firmaImg, {
                x: 50,  // Posición a la izquierda 📏
                y: 100, // Posición desde abajo 📏
                width: 150, 
                height: 75
            });

            // Descargar el PDF final
            const pdfModificado = await pdfDoc.save();
            const blob = new Blob([pdfModificado], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "documento_final.pdf";
            link.click();
        }
    </script>
</body>
</html>
